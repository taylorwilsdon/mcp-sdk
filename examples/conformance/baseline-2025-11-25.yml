# Scenarios required by revision 2025-11-25 that this SDK does not pass.
server:
  # A stateless server sends nothing outside a request, which is where this
  # revision delivers log messages and resource update notifications.
  - logging-set-level
  - tools-call-with-logging
  - resources-subscribe
  - resources-unsubscribe
client:
  # Resuming an SSE stream with Last-Event-ID is not implemented.
  - sse-retry
  # The client has no OAuth flow; Mcp_http.Client.v ~headers carries a bearer
  # token obtained elsewhere.
  - auth/metadata-default
  - auth/metadata-var1
  - auth/metadata-var2
  - auth/metadata-var3
  - auth/basic-cimd
  - auth/scope-from-www-authenticate
  - auth/scope-from-scopes-supported
  - auth/scope-omitted-when-undefined
  - auth/scope-step-up
  - auth/scope-retry-limit
  - auth/token-endpoint-auth-basic
  - auth/token-endpoint-auth-post
  - auth/token-endpoint-auth-none
  - auth/pre-registration
